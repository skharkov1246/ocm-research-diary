# Запрос данных установки для проверки модели (VALIDATION_PLAN.md, раздел 3).
# Данных установки в репозитории нет. Все значения ниже — ТЕСТОВЫЕ: example = true, в поле value
# стоит слово EXAMPLE. Единицы — СИ. Точность — требование к датчику или расчёту; где не указан
# стандарт, это типичное значение, его сверяют с паспортом прибора заказчика.
# Расчётная точка первой проверки — Taurus 60 в генераторном исполнении (решение владельца 14.11.2026).

[meta]
purpose = "журналы режимов ГТУ для сверки модели цикла на номинале и частичных нагрузках"
record_rate_raw = "1 с (или собственный шаг архива АСУ ТП, без сжатия с зоной нечувствительности)"
steady_window = "не менее 30 мин подряд на каждый режим; критерии установившегося режима — VALIDATION_PLAN.md, 3.2"
period = "12 месяцев: калибровка по одному сезону, проверка — по другому"
format = "CSV, одна строка — одна отметка времени UTC, столбцы — величины ниже (поле tag)"
example = true

[[signal]]
tag = "T_amb"
name = "температура воздуха на входе в фильтр"
unit = "K"
rate = "1 с"
accuracy = "±0,5 K (термометр сопротивления; тип и класс — по паспорту прибора)"
owner = "заказчик: служба эксплуатации, архив АСУ ТП"
impact = "главная величина поправки мощности к условиям ISO (PTC 22-2014: обычно наиболее критичная для приведённой мощности — по выдержке поиска)"
value = "EXAMPLE 288.15"
example = true

[[signal]]
tag = "p_amb"
name = "барометрическое давление"
unit = "Pa"
rate = "1 мин"
accuracy = "±50 Pa"
owner = "заказчик: АСУ ТП или метеостанция площадки"
impact = "расход воздуха и мощность пропорциональны давлению на входе"
value = "EXAMPLE 101325"
example = true

[[signal]]
tag = "RH"
name = "относительная влажность воздуха"
unit = "1 (доля)"
rate = "1 мин"
accuracy = "±0,03"
owner = "заказчик: АСУ ТП или метеостанция площадки"
impact = "малая поправка мощности и КПД; модель сейчас считает сухой воздух"
value = "EXAMPLE 0.60"
example = true

[[signal]]
tag = "dp_inlet"
name = "потеря давления на входном устройстве (фильтр, глушитель)"
unit = "Pa"
rate = "1 с"
accuracy = "±25 Pa"
owner = "заказчик: АСУ ТП пакета"
impact = "паспорт ISO — без потерь на входе и выхлопе; без этой величины поправка к паспорту неточна"
value = "EXAMPLE 1000"
example = true

[[signal]]
tag = "dp_exhaust"
name = "противодавление выхлопа (котёл-утилизатор, глушитель)"
unit = "Pa"
rate = "1 с"
accuracy = "±25 Pa"
owner = "заказчик: АСУ ТП пакета"
impact = "мощность силовой турбины и температура выхлопа"
value = "EXAMPLE 2500"
example = true

[[signal]]
tag = "m_fuel"
name = "массовый расход топливного газа"
unit = "kg/s"
rate = "1 с"
accuracy = "±0,5 % (кориолисов или ультразвуковой расходомер; сверить с паспортом прибора)"
owner = "заказчик: узел учёта газа"
impact = "входит в расход тепла один к одному: ошибка расхода топлива = ошибка расхода тепла"
value = "EXAMPLE 0.36"
example = true

[[signal]]
tag = "fuel_composition"
name = "состав топливного газа (хроматограф) -> низшая теплота сгорания"
unit = "мольные доли; LHV в J/kg"
rate = "1 раз в 15 мин – 1 ч (по хроматографу) или паспорт газа за сутки"
accuracy = "LHV ±0,4 % (PTC 22-2014 даёт 0,4 % как ориентир для теплоты сгорания газа — по выдержке поиска)"
owner = "заказчик: химическая лаборатория / поставщик газа"
impact = "входит в расход тепла один к одному; модель сейчас считает чистый метан (LHV 50,03 MJ/kg)"
value = "EXAMPLE CH4 0.95, C2H6 0.03, N2 0.01, CO2 0.01; LHV 47.6e6"
example = true

[[signal]]
tag = "T_fuel"
name = "температура топливного газа перед двигателем"
unit = "K"
rate = "1 мин"
accuracy = "±1 K"
owner = "заказчик: АСУ ТП пакета"
impact = "физическая теплота топлива; малая поправка"
value = "EXAMPLE 293"
example = true

[[signal]]
tag = "P_el"
name = "активная мощность на клеммах генератора"
unit = "W"
rate = "1 с"
accuracy = "±0,5 % (счётчик и трансформаторы тока и напряжения класса 0,2 — сверить с паспортами)"
owner = "заказчик: электроцех, коммерческий или технический учёт"
impact = "главный выход проверки; для генераторного исполнения сравнивается напрямую"
value = "EXAMPLE 5.5e6"
example = true

[[signal]]
tag = "Q_el_cosphi"
name = "реактивная мощность или коэффициент мощности, напряжение, частота сети"
unit = "var; 1; V; Hz"
rate = "1 с"
accuracy = "±1 %; ±0,01; ±0,5 %; ±0,01 Hz"
owner = "заказчик: электроцех"
impact = "КПД генератора зависит от cos φ; модель сейчас переводит вал в клеммы постоянными 0,972 × 0,985 (оценка)"
value = "EXAMPLE 3.0e6; 0.88; 6300; 50.0"
example = true

[[signal]]
tag = "P_aux"
name = "собственные нужды пакета, питающиеся от генератора"
unit = "W"
rate = "1 мин"
accuracy = "±2 %"
owner = "заказчик: электроцех"
impact = "отделяет мощность брутто (паспорт ISO) от нетто"
value = "EXAMPLE 1.2e5"
example = true

[[signal]]
tag = "n_gg"
name = "частота вращения газогенератора (или единственного вала)"
unit = "rad/s (допускается об/мин с пересчётом)"
rate = "1 с"
accuracy = "±0,1 %"
owner = "заказчик: АСУ ТП пакета"
impact = "положение на характеристике компрессора; нужна модели частичных нагрузок (её пока нет)"
value = "EXAMPLE 1565"
example = true

[[signal]]
tag = "n_pt"
name = "частота вращения выходного вала (силовой турбины) — для приводного исполнения"
unit = "rad/s"
rate = "1 с"
accuracy = "±0,1 %"
owner = "заказчик: АСУ ТП пакета"
impact = "частота и момент на муфте: M = P / ω"
value = "EXAMPLE 1497"
example = true

[[signal]]
tag = "M_shaft"
name = "момент на муфте (если стоит моментомер) — для приводного исполнения"
unit = "N·m"
rate = "1 с"
accuracy = "±1 % (по паспорту моментомера)"
owner = "заказчик: служба эксплуатации; если моментомера нет — мощность по технологическому компрессору"
impact = "прямое измерение механической мощности на валу; без него ошибка мощности привода 2–3 % и больше"
value = "EXAMPLE 3830"
example = true

[[signal]]
tag = "process_compressor"
name = "технологический компрессор: давления и температуры всасывания и нагнетания, расход и состав газа"
unit = "Pa; K; kg/s; мольные доли"
rate = "1 с (давления, температуры), 1 мин (расход), сутки (состав)"
accuracy = "±0,25 %; ±1 K; ±1 %; по хроматографу"
owner = "заказчик: технологическая служба компрессорной станции"
impact = "мощность привода по приросту энтальпии газа, если нет моментомера; карта компрессора — от изготовителя компрессора"
value = "EXAMPLE 3.0e6; 5.0e6; 288; 330; 25.0"
example = true

[[signal]]
tag = "p2_T2"
name = "давление и температура за компрессором двигателя"
unit = "Pa; K"
rate = "1 с"
accuracy = "±0,25 %; ±2 K"
owner = "заказчик: АСУ ТП пакета"
impact = "степень сжатия и КПД компрессора двигателя на режиме — прямая сверка узла модели"
value = "EXAMPLE 1.236e6; 642"
example = true

[[signal]]
tag = "T_control"
name = "температура регулирования (между турбинами: у Solar — перед силовой турбиной), все термопары"
unit = "K"
rate = "1 с"
accuracy = "±0,004·|t| на термопару (IEC 60584-1, класс 1, тип K — по выдержке поиска, лист WIKA)"
owner = "заказчик: АСУ ТП пакета"
impact = "сверка T45 модели и разброс по окружности (качество камеры); по среднему — режим регулирования"
value = "EXAMPLE 1026"
example = true

[[signal]]
tag = "T_exhaust"
name = "температура выхлопа, все термопары по сечению"
unit = "K"
rate = "1 с"
accuracy = "±0,004·|t| на термопару (IEC 60584-1, класс 1); среднее — по числу термопар"
owner = "заказчик: АСУ ТП пакета"
impact = "температура выхлопа задаёт T41 в модели (validate_fleet.py): 1 K выхлопа ≈ 2 K T41"
value = "EXAMPLE 783"
example = true

[[signal]]
tag = "igv_bleed"
name = "положение входного направляющего аппарата и поворотных НА, состояние перепускных клапанов"
unit = "rad; 0/1"
rate = "1 с"
accuracy = "±0,5°"
owner = "заказчик: АСУ ТП пакета"
impact = "закон управления на частичных нагрузках; без него частичные режимы не сверить"
value = "EXAMPLE 0.0; 0"
example = true

[[signal]]
tag = "condition"
name = "наработка, число пусков, даты промывок компрессора и последнего капремонта"
unit = "s; 1; дата"
rate = "журнал событий"
accuracy = "—"
owner = "заказчик: служба эксплуатации"
impact = "износ и загрязнение снижают мощность и КПД против паспорта нового двигателя; без журнала износ неотличим от ошибки модели"
value = "EXAMPLE 1.8e8; 950; 2026-10-01"
example = true

[[signal]]
tag = "events"
name = "журнал событий: пуски, остановы, смены нагрузки, срабатывания защит"
unit = "—"
rate = "по событию"
accuracy = "—"
owner = "заказчик: АСУ ТП"
impact = "выбор окон установившегося режима"
value = "EXAMPLE 2026-10-05T08:00Z пуск"
example = true

# Данные изготовителя пакета, нужные для приведения к условиям ISO и для частичных режимов.
[[document]]
name = "кривые поправок мощности и расхода тепла на T входа, давление, потери входа и выхлопа"
owner = "изготовитель пакета (через заказчика); открытые листы данных их не содержат"
impact = "без них сравнение с паспортом ISO идёт через модель — ошибка модели входит в эталон"
example = true

[[document]]
name = "протокол заводских или приёмочных испытаний данного двигателя (если был)"
owner = "заказчик"
impact = "эталон с известной погрешностью; лучше паспорта каталога"
example = true
