# Проверка модели цикла вне калибровки (validate_fleet.py).
# Решения записаны ДО расчёта; основной вариант — "interp". Остальные варианты — чувствительность.

[inputs]
fleet_glob = "../fleet/gtu_fleet_*.json"          # сверенные паспорта, навык gtu-fleet
calibration = "../gtu_study_results.json"          # калиброванные КПД узлов и доли охлаждения

# Расход выхлопа, по которому калибровались наборы (литералы gtu_study.py, вызов calib):
# SGT-400 — 39,4 кг/с, Taurus 60 — 21,63 кг/с. По нему строится интерполяция по размеру.
[calibration_flow_kg_s]
T60 = 21.63
SGT400 = 39.4

[records]
# Записи паспортов, вошедшие в калибровку (в коде gtu_study.py — близкие к ним литералы).
calibration = ["taurus60:MD", "sgt400:MD 13 MW"]
# Тот же двигатель или та же модель в другом исполнении — не независимы от калибровки.
related = ["taurus60:GS", "sgt400:PG 13 MW", "sgt400:PG 15 MW", "sgt400:MD 15 MW"]
# Рекуперативные установки: простой цикл к ним неприменим, дополнительно считается recup.
recuperated_models = ["Mercury"]

[model]
# Генераторное исполнение: паспорт — на клеммах; модель — на валу. Перевод — принятые КПД
# генератора 0,972 и редуктора 0,985 (как ETA_GEN в gtu_family.py; оценка, не паспорт).
eta_generator = 0.972
eta_gearbox = 0.985
# Поиск температуры газа перед рабочим колесом 1-й ступени T41, °C, под паспортную температуру выхлопа.
T41_min_C = 600.0
T41_max_C = 1500.0
T41_xtol_K = 0.2
workers = 4

# Варианты наборов КПД узлов и охлаждения.
#   fixed   — набор одной калибровки для всех машин;
#   interp  — КПД узлов и доли охлаждения линейно по ln(расход выхлопа) между двумя калибровками,
#             вне диапазона 21,63–39,4 кг/с — ближайший набор (без экстраполяции);
#   cool_T41 = true — доли охлаждения СА и ротора растут на 12 % отн. на каждые 50 °C T41 сверх
#             калибровочной (правило сетки gtu_study.py, принято), не ниже нуля.
[[variant]]
key = "interp"
kind = "interp"
primary = true
label = "КПД узлов и охлаждение по размеру (интерполяция между калибровками) — основной"

[[variant]]
key = "T60"
kind = "fixed"
set = "T60"
label = "набор Taurus 60 для всех машин"

[[variant]]
key = "SGT400"
kind = "fixed"
set = "SGT400"
label = "набор SGT-400 для всех машин"

[[variant]]
key = "interp_coolT41"
kind = "interp"
cool_T41 = true
label = "интерполяция + охлаждение растёт с T41 (правило gtu_study.py)"

# Рекуператор (Mercury 50): степень регенерации не опубликована в открытых листах данных —
# принята, перебор двух значений. Температура выхлопа паспорта — за рекуператором; она
# сравнивается с точной температурой из баланса рекуператора (balances.stack_temperature),
# а не с оценкой recup (её ошибка — balances_results.json).
[recup]
eps = [0.85, 0.90]
variant = "interp"

# Локальные производные (центральная разность ±10 K по T41, ±0,01 по ε): как погрешность
# температуры выхлопа переходит в мощность и КПД; насколько плохо обусловлен перевод через рекуператор.
[sensitivity]
cycle_records = ["taurus60:MD", "sgt400:MD 13 MW", "saturn20:GS", "titan130:GS"]
recup_eps = 0.90

# Оговорки к данным паспорта (из полей notes / unverified файлов fleet/): запись остаётся в
# статистике, но статистика повторяется и без неё.
[data_caveats]
"titan130:MD" = "π 16:1 — из листов DS130MD/1109 и DS130CS/1109 старой редакции 15 290 кВт, мощность и КПД — редакция 17 500 кВт (fleet/gtu_fleet_titan130.json, notes: «PR and speeds at the 17 500 kW rating are not confirmed»)"
"sgt500:PG" = "КПД напечатан 33,6 %, по расходу тепла 33,80 % (взято 33,8, разночтение открыто); второго независимого источника ни для одного числа SGT-500 нет (fleet/gtu_fleet_sgt500.json, unverified)"

# Пороги, по которым запись попадает в список «где модель ломается»: принятая погрешность отбора
# схем ±2 п. п. по КПД (README трека) и 5 % по мощности (оценка: ±2 п. п. при КПД ~30 % — около 6–7 %
# по удельной работе; берём строже).
[breaks]
eff_pp = 2.0
power_pct = 5.0
