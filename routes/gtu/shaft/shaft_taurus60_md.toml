# Taurus 60, механический привод (MD): газогенератор (компрессор + турбина газогенератора) и
# свободная силовая турбина -> муфта -> технологический центробежный компрессор (прямой привод).
# Граница замены — муфта на валу силовой турбины. Частота силовой турбины задаётся нагрузкой
# техкомпрессора: его карта (напор–расход–КПД по частоте) пересекается с характеристикой сети.
# Значение-таблица { value = ..., example = true, ... } — тестовое (EXAMPLE), см. shaft_taurus60_gs.toml.

[unit]
key = "taurus60_md"
title = "Taurus 60, механический привод (MD)"
layout = "two_shaft_md"
passport = "../fleet/gtu_fleet_taurus60.json"
variant = "MD"

[passport_fields]
P_out_kW = "power_kW"                       # кВт на валу, ISO, «при оптимальной частоте СТ»
eff_pct = "eff_pct"
exh_flow_kg_s = "exh_flow_kg_s"
exh_temp_C = "exh_temp_C"
PR = "PR"
N_pt_max_rpm = "extra.pt_max_rpm"           # 14 300 об/мин — наибольшая частота СТ
N_gg_max_rpm = "extra.gp_max_rpm"           # 15 000 об/мин — наибольшая частота газогенератора

[regimes]
T_amb_C = [-30.0, -15.0, 0.0, 15.0, 30.0, 45.0]
load_pct = [100.0, 90.0, 75.0, 50.0]

[site]
P_amb_Pa = 101325.0
dp_inlet_Pa = 0.0
dp_exhaust_Pa = 0.0
T_fuel_K = 288.15

[engine]
eta_base = [0.875, 0.865, 0.885]   # компрессор; турбина газогенератора; силовая турбина (как gtu_study, Taurus 60)
x_ngv = 0.045
x_rot = 0.045
x_leak = 0.015
dp_comb = 0.04
dp_duct = 0.01               # переходный канал между турбинами (как gtu_cycle)
p_exh_ratio = 1.02
eta_b = 0.995
eta_m = 0.99
W1_exh_div = 1.004
T41_bracket_C = [850.0, 1450.0]
k_nu = 1.0
N_gg_d_rpm = { value = 14400.0, unit = "об/мин", owner = "изготовитель двигателя", example = true, impact = "только пересчёт приведённой частоты газогенератора в физическую и проверка предела 15 000 об/мин; на P, M, n на муфте не влияет", replaced_by = "14 400 об/мин при ISO и полной мощности — пример" }

[compressor_map]
file = "maps/npss_hbtf_hpc.json"
alpha_slice = 0
Nc_map_d = 1.0
Rline_d = 2.0

[train]                      # технологический центробежный компрессор: карта по законам подобия от линии расчётной частоты
n_pt_d_rpm = { value = 13000.0, unit = "об/мин", owner = "изготовитель агрегата", example = true, impact = "M = P/omega обратно пропорционален частоте; КПД СТ вне оптимума", replaced_by = "13 000 об/мин — пример (паспорт даёт только наибольшую 14 300 и рейтинг «при оптимальной частоте СТ»)", sens_key = "n_pt_d" }
speed_range = { value = [0.70, 1.05], unit = "доля n_pt_d", owner = "изготовитель агрегата", example = true, impact = "допустимый диапазон частоты техкомпрессора; верх ограничивает мощность в холод", replaced_by = "0,70…1,05 — пример; предел СТ 14 300 об/мин — из паспорта" }
H_p_d_kJkg = { value = 55.0, unit = "кДж/кг (политропный напор)", owner = "заказчик или изготовитель компрессора", example = true, impact = "расход газа при той же мощности; на P на муфте при полной нагрузке не влияет (компрессор подобран под P ISO)", replaced_by = "55 кДж/кг — пример" }
eta_p_d = { value = 0.80, unit = "—", owner = "заказчик или изготовитель компрессора", example = true, impact = "мощность техкомпрессора при заданном расходе; частота на частичной нагрузке", replaced_by = "0,80 — пример" }
head_coeffs = { value = [0.80, 0.8667, -0.6667], unit = "—", owner = "заказчик или изготовитель компрессора", example = true, impact = "наклон линии частоты H(Q): частота и запас до помпажа на частичной нагрузке", replaced_by = "H/H_d = c0 + c1*x + c2*x^2, x = Q/(s*Q_d): +8 % у помпажа (x = 0,7), -20 % у запирания (x = 1,3) — пример" }
eta_k = { value = 0.8, unit = "—", owner = "заказчик или изготовитель компрессора", example = true, impact = "КПД вне расчётного расхода", replaced_by = "eta/eta_d = 1 - k*(x - 1)^2 — пример" }
x_surge = { value = 0.70, unit = "—", owner = "изготовитель компрессора", example = true, impact = "граница помпажа: флаг режима", replaced_by = "0,70 — пример" }
x_choke = { value = 1.30, unit = "—", owner = "изготовитель компрессора", example = true, impact = "граница запирания: флаг режима", replaced_by = "1,30 — пример" }
P_mloss_kW = { value = 45.0, unit = "кВт", owner = "изготовитель компрессора", example = true, impact = "мощность на муфте сверх газовой: подшипники и уплотнения", replaced_by = "45 кВт — пример" }
gas_MW = { value = 17.0, unit = "кг/кмоль", owner = "заказчик (состав газа)", example = true, impact = "плотность на всасывании и расход; степень сжатия", replaced_by = "17,0 кг/кмоль — пример (природный газ)" }
Z_s = { value = 0.93, unit = "—", owner = "заказчик (состав газа)", example = true, impact = "плотность на всасывании", replaced_by = "0,93 — пример" }
kappa = { value = 1.30, unit = "—", owner = "заказчик (состав газа)", example = true, impact = "только степень сжатия в выгрузке", replaced_by = "1,30 — пример" }
p_s_Pa = { value = 3.8e6, unit = "Па", owner = "заказчик (режим станции)", example = true, impact = "плотность и расход газа; давление нагнетания в выгрузке", replaced_by = "3,8 МПа — пример" }
T_s_K = { value = 288.15, unit = "К", owner = "заказчик (режим станции)", example = true, impact = "плотность на всасывании", replaced_by = "288,15 К — пример" }
H_static_share = { value = 0.30, unit = "—", owner = "заказчик (характеристика сети)", example = true, impact = "частота техкомпрессора на частичной нагрузке и запас до помпажа", replaced_by = "сеть H = H_d*(0,30 + 0,70*(Q/Q_d)^2) — пример" }

[[data_needed]]
parameter = "Характеристика компрессора газогенератора: расход, степень сжатия, КПД по приведённой частоте"
unit = "кг/с; —; —"
owner = "изготовитель двигателя"
impact = "мощность вне ISO и частота газогенератора"
replaced_by = "обобщённая карта NPSS HBTF HPC (pyCycle 4.4.0), масштаб на точку ISO"
sens_key = "map"

[[data_needed]]
parameter = "Предел температуры газа: уставка T5 (третий сопловой аппарат, вход СТ) и её поправка по T_нв"
unit = "К"
owner = "изготовитель двигателя"
impact = "полная мощность в жару и в холод: закон «T41 постоянна» против «T45 постоянна»"
replaced_by = "T41 постоянна и равна калибровочной при ISO"
sens_key = "control"

[[data_needed]]
parameter = "Пропускная способность турбины газогенератора и СТ, КПД СТ по частоте"
unit = "кг*К^0,5/(с*Па); —"
owner = "изготовитель двигателя"
impact = "согласование газогенератора и СТ; КПД СТ вне оптимальной частоты"
replaced_by = "калибровка по ISO и закон эллипса Стодолы; КПД — парабола по U/C0, k = 1"
sens_key = "k_nu"

[[data_needed]]
parameter = "Атмосферное давление (высота площадки), потери давления на входе и выхлопе площадки"
unit = "Па"
owner = "заказчик (площадка), изготовитель пакета"
impact = "полная мощность и КПД"
replaced_by = "101 325 Па; потерь нет (основа паспорта ISO)"
sens_key = "dp"

[[data_needed]]
parameter = "Фактические рабочие точки: P на валу (или расход и напор техкомпрессора), n СТ, n газогенератора, T_нв, расход топлива, T5"
unit = "Вт; об/мин; К; кг/с; К"
owner = "заказчик (эксплуатация)"
impact = "без них проверка вне калибровки не проведена: точность вне ISO не оценена"
replaced_by = "нет; сверка только с паспортом ISO"
