# Taurus 60, генераторное исполнение (GS): одновальный ГТД -> эпициклический редуктор -> генератор.
# Граница замены — муфта на выходном валу двигателя (вход редуктора). На муфте — механическая
# мощность P_мех; на клеммах генератора — P_эл = P_мех * eta_ред * eta_ген.
# Значение-таблица { value = ..., example = true, ... } — тестовое (EXAMPLE) до получения данных
# установки: единицы, владелец данных, влияние на точность и чем заменено — в самой записи;
# из этих записей gtu_shaft.py собирает data_needed.csv.

[unit]
key = "taurus60_gs"
title = "Taurus 60, генераторное исполнение (GS)"
layout = "single_shaft_gen"                 # single_shaft_gen | two_shaft_md
passport = "../fleet/gtu_fleet_taurus60.json"
variant = "GS"

[passport_fields]                           # поле сверенного паспорта (records[variant]) -> вход расчёта
P_out_kW = "power_kW"                       # кВт эл. на клеммах, ISO
eff_pct = "eff_pct"                         # % на клеммах
exh_flow_kg_s = "exh_flow_kg_s"
exh_temp_C = "exh_temp_C"                   # проверка калибровки, не вход
PR = "PR"
N_out_rpm = "extra.turbine_max_speed_rpm"   # 14 950 об/мин: вал двигателя = вход редуктора

[regimes]
T_amb_C = [-30.0, -15.0, 0.0, 15.0, 30.0, 45.0]
load_pct = [100.0, 90.0, 75.0, 50.0]        # доля полной мощности при той же T_нв

[site]
P_amb_Pa = 101325.0          # ISO, уровень моря (площадка — data_needed)
dp_inlet_Pa = 0.0            # паспорт ISO: «No inlet/exhaust losses»
dp_exhaust_Pa = 0.0
T_fuel_K = 288.15            # топливо — метан, как в gtu_cycle.py

[engine]
# Калибровка — как gtu_study.calib: общий сдвиг d к трём КПД и T41 под мощность и КПД паспорта.
eta_base = [0.875, 0.865, 0.885]   # компрессор; турбина — часть на компрессор; часть на выход (база gtu_study, Taurus 60)
x_ngv = 0.045                # доли расхода воздуха: охлаждение СА, ротора, утечки (как gtu_study, coolA)
x_rot = 0.045
x_leak = 0.015
dp_comb = 0.04
dp_duct = 0.0                # одновальный: переходного канала нет (у gtu_cycle по умолчанию 0,01 — двухвальный)
p_exh_ratio = 1.02           # как gtu_cycle: давление за турбиной = 1,02 * p_атм
eta_b = 0.995
eta_m = 0.99
W1_exh_div = 1.004           # воздух на входе = выхлоп / 1,004 (соглашение gtu_study)
T41_bracket_C = [850.0, 1450.0]
k_nu = 1.0                   # допущение: КПД турбины по U/C0 — парабола eta/eta_d = 1 - k*(nu/nu_d - 1)^2

[compressor_map]             # обобщённая характеристика компрессора ГТД — допущение (maps/*.json, источник внутри)
file = "maps/npss_hbtf_hpc.json"
alpha_slice = 0
Nc_map_d = 1.0               # расчётная точка на карте: Nc = 1,0; R = 2,0 (PR карты 10,894 = defaults.PR)
Rline_d = 2.0

[train]                      # редуктор и генератор — сохраняются; данные агрегата отсутствуют
grid_Hz = { value = 50.0, unit = "Гц", owner = "заказчик (площадка)", example = true, impact = "частота генератора 1500 или 1800 об/мин (паспорт: редуктор 1500/1800); на муфте частота 14 950 об/мин не меняется", replaced_by = "50 Гц — пример" }
gen_poles = 4
eta_gen_ref = { value = 0.972, unit = "—", owner = "изготовитель агрегата (генератор)", example = true, impact = "пересчёт кВт на клеммах в кВт на муфте один к одному: калибровка ведётся по P_эл паспорта", replaced_by = "0,972 при 5670 кВт эл. — оценка трека (gtu_family.ETA_GEN)", sens_key = "eta_gen" }
eta_red_ref = { value = 0.985, unit = "—", owner = "изготовитель агрегата (редуктор)", example = true, impact = "как КПД генератора: P_мех = P_эл / (eta_ред * eta_ген)", replaced_by = "0,985 при номинале — оценка трека (gtu_family.ETA_GEN)", sens_key = "eta_red" }
gen_loss_fixed_share = { value = 0.35, unit = "—", owner = "изготовитель агрегата (генератор)", example = true, impact = "КПД генератора на частичной нагрузке: P_эл при 50 % нагрузки", replaced_by = "доля постоянных потерь 0,35 — пример" }
red_loss_fixed_share = { value = 0.50, unit = "—", owner = "изготовитель агрегата (редуктор)", example = true, impact = "КПД редуктора на частичной нагрузке", replaced_by = "доля постоянных потерь 0,50 — пример" }
gen_rated_kWe = { value = 6500.0, unit = "кВт", owner = "изготовитель агрегата (генератор)", example = true, impact = "ограничение полной мощности в холод: при превышении T41 снижается до P_эл = номинал", replaced_by = "6500 кВт эл. — пример" }
red_rated_kW = { value = 6900.0, unit = "кВт (на входе); момент = P/omega, Н·м", owner = "изготовитель агрегата (редуктор)", example = true, impact = "ограничение момента на муфте в холод", replaced_by = "6900 кВт на 14 950 об/мин (4407 Н·м) — пример" }

[[data_needed]]
parameter = "Характеристика компрессора двигателя: расход, степень сжатия, КПД по приведённой частоте"
unit = "кг/с; —; —"
owner = "изготовитель двигателя"
impact = "мощность вне ISO (форма линий частоты)"
replaced_by = "обобщённая карта NPSS HBTF HPC (pyCycle 4.4.0), масштаб на точку ISO"
sens_key = "map"

[[data_needed]]
parameter = "Закон управления ВНА и поворотными НА по приведённой частоте и нагрузке"
unit = "рад"
owner = "изготовитель двигателя"
impact = "расход воздуха, расход топлива и T выхлопа на частичной нагрузке; P, M, n на муфте генераторного исполнения не меняет (нагрузка задана)"
replaced_by = "ВНА и НА неподвижны в расчётном положении"

[[data_needed]]
parameter = "Предел температуры газа: уставка регулятора и её поправка по T_нв"
unit = "К"
owner = "изготовитель двигателя"
impact = "полная мощность в жару и в холод"
replaced_by = "T41 постоянна и равна калибровочной при ISO"

[[data_needed]]
parameter = "Пропускная способность турбины W*sqrt(T)/p и КПД вне расчётного режима"
unit = "кг*К^0,5/(с*Па); —"
owner = "изготовитель двигателя"
impact = "согласование узлов вне ISO; КПД турбины по U/C0"
replaced_by = "калибровка по ISO и закон эллипса Стодолы; КПД — парабола по U/C0, k = 1"
sens_key = "k_nu"

[[data_needed]]
parameter = "Атмосферное давление (высота площадки), потери давления на входе и выхлопе площадки"
unit = "Па"
owner = "заказчик (площадка), изготовитель пакета"
impact = "полная мощность и КПД"
replaced_by = "101 325 Па; потерь нет (основа паспорта ISO)"
sens_key = "dp"

[[data_needed]]
parameter = "Состав и температура топливного газа, низшая теплота сгорания"
unit = "Дж/кг; К"
owner = "заказчик (эксплуатация)"
impact = "расход топлива обратно пропорционален LHV; на P, M, n на муфте не влияет"
replaced_by = "метан 50,03 МДж/кг, 288,15 К (gtu_cycle.py)"

[[data_needed]]
parameter = "Влажность воздуха"
unit = "кг/кг"
owner = "заказчик (площадка)"
impact = "не учитывается: воздух сухой; влияние не посчитано"
replaced_by = "сухой воздух"

[[data_needed]]
parameter = "Фактические рабочие точки: P_эл, T_нв, p_атм, расход топлива, T выхлопа, положение ВНА"
unit = "Вт; К; Па; кг/с; К; рад"
owner = "заказчик (эксплуатация)"
impact = "без них проверка вне калибровки не проведена: точность вне ISO не оценена"
replaced_by = "нет; сверка только с паспортом ISO"
