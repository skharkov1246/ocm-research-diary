<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MatterForge diary</title>
  <meta name="description" content="A rigorous, bilingual (RU/EN) diary of quantum-chemistry experiments on turning methane into ethylene in one step." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="matterforge.css?v=20260711" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>" />
</head>
<body data-lang="ru" data-level="simple">

  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <span class="brand-mark">⚛︎</span>
        <div>
          <h1 id="site-title">MatterForge diary</h1>
          <p id="site-subtitle" class="subtitle"></p>
        </div>
      </div>

      <div class="controls">
        <div class="toggle-group" id="lang-group" role="group" aria-label="Language">
          <span class="toggle-label" id="lang-label"></span>
          <button class="toggle" data-set="lang" data-value="ru">RU</button>
          <button class="toggle" data-set="lang" data-value="en">EN</button>
        </div>
        <div class="toggle-group" id="level-group" role="group" aria-label="Level">
          <span class="toggle-label" id="level-label"></span>
          <button class="toggle" data-set="level" data-value="simple" id="lvl-simple"></button>
          <button class="toggle" data-set="level" data-value="tech" id="lvl-tech"></button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">

    <!-- MatterForge tabs: tab 0 = OCM diary (below), tabs 1..N from
         assets/matterforge/matterforge_tabs_content.json. Filled by matterforge.js. -->
    <nav class="mf-tabs" id="mf-tabs" role="tablist" aria-label="MatterForge sections"></nav>
    <div id="mf-view" hidden></div>

    <section class="hero">
      <p id="hero-text" class="hero-text"></p>
      <p id="honesty-note" class="honesty-note"></p>
    </section>

    <nav class="toc" id="toc" aria-label="Diary contents"></nav>

    <section id="diary" class="diary"></section>

    <section class="glossary" id="glossary">
      <h2 id="glossary-title"></h2>
      <dl id="glossary-list"></dl>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="footer-honesty"></p>
      <p class="muted">Built with PennyLane · PySCF · CASCI/VQE — and an unbreakable rule of data integrity.
         <a id="repo-link" href="#" target="_blank" rel="noopener">source ↗</a></p>
    </div>
  </footer>

  <script src="entries.js"></script>
  <script src="app.js?v=20260702"></script>
  <script src="matterforge.js?v=20260711"></script>
</body>
</html>
