name: Gate — проверки перед мержем

# Барьер на пути в main: те же проверки, что и перед публикацией, но на ветке и PR.
# Ничего не публикует. Чтобы сделать обязательным:
# Settings → Rules → Rulesets → main → Require status checks → gate.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # полная история: на PR сканер секретов сравнивает с base-веткой
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Проверка содержимого
        run: node tools/validate.mjs

      - name: Каталог данных актуален
        run: node tools/build_catalog.mjs --check

      - name: Smoke-тест страниц в браузере
        run: node tools/smoke.mjs

      - name: Поиск секретов в изменённых файлах
        run: |
          set -euo pipefail
          # Полная история (fetch-depth: 0) даёт PR общую базу с base-веткой. Если
          # сравнение всё же не удалось, проверяются все файлы, а не «нет изменённых».
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD --diff-filter=ACM 2>/dev/null)" || files="$(git ls-files)"
          else
            files="$(git diff --name-only HEAD~1...HEAD --diff-filter=ACM 2>/dev/null)" || files="$(git ls-files)"
          fi
          [ -z "$files" ] && { echo "нет изменённых файлов"; exit 0; }
          # Ключ AWS записан как aws_secret[_]access_key: иначе шаблон находит сам
          # себя в этом файле. Ищется значение ключа (40 знаков после имени поля),
          # а не само имя: имя поля законно встречается в коде, который маскирует секреты.
          pattern='sk-ant-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|aws_secret[_]access_key[[:space:]]*[=:][[:space:]]*.?[A-Za-z0-9/+]{40}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          # ЯВНАЯ ПОМЕТКА ВМЕСТО ИСКЛЮЧЕНИЯ ПУТЕЙ (как в gate КВАНТ, решение владельца
          # 14.11.2026): выдуманное значение для теста помечается в самом значении словом
          # SYNTHETIC, FIXTURE, EXAMPLE или PLACEHOLDER — его видно глазом в той же строке.
          fake='SYNTHETIC|FIXTURE|EXAMPLE|PLACEHOLDER'
          hits=""
          for f in $files; do
            [ -f "$f" ] || continue
            case "$f" in *.png|*.jpg|*.pdf|*.npz|*.pptx) continue;; esac
            found="$(grep -oEI "$pattern" "$f" 2>/dev/null | grep -vE "$fake" || true)"
            if [ -n "$found" ]; then hits="$hits $f"; fi
          done
          if [ -n "$hits" ]; then
            echo "::error::возможные секреты в файлах:$hits"
            echo "Если это выдуманное значение для теста — впишите в него SYNTHETIC, FIXTURE, EXAMPLE или PLACEHOLDER."
            exit 1
          fi
          echo "✓ секретов не найдено"
