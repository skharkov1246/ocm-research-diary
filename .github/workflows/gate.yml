name: Gate — проверки перед мержем

# Барьер на пути в main: те же проверки, что и перед публикацией, но на ветке и PR.
# Ничего не публикует. Чтобы сделать обязательным:
# Settings → Rules → Rulesets → main → Require status checks → gate.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Проверка содержимого
        run: node tools/validate.mjs

      - name: Каталог данных актуален
        run: node tools/build_catalog.mjs --check

      - name: Smoke-тест страниц в браузере
        run: node tools/smoke.mjs

      - name: Поиск секретов в изменённых файлах
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" || true
            files="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD --diff-filter=ACM || true)"
          else
            files="$(git diff --name-only HEAD~1...HEAD --diff-filter=ACM 2>/dev/null || git ls-files)"
          fi
          [ -z "$files" ] && { echo "нет изменённых файлов"; exit 0; }
          pattern='sk-ant-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|aws_secret_access_key|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          hits=""
          for f in $files; do
            [ -f "$f" ] || continue
            case "$f" in *.png|*.jpg|*.pdf|*.npz|*.pptx) continue;; esac
            grep -nEI "$pattern" "$f" >/dev/null 2>&1 && hits="$hits $f"
          done
          if [ -n "$hits" ]; then
            echo "::error::возможные секреты в файлах:$hits"
            exit 1
          fi
          echo "✓ секретов не найдено"
